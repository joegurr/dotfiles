- clean: ['~']

- link:
    # misc
    ~/.tmux.conf: tmux.conf
    ~/.markdownlintrc: markdownlint.json
    ~/.ssh/config: ssh.conf
    # config
    ~/.config/sway/config: config/swayconfig
    ~/.config/gammastep/config.ini: config/gammastep.conf
    ~/.config/waybar/config.jsonc: config/waybar/config.jsonc
    ~/.config/foot/foot.ini: config/foot.ini
    ~/.config/zathura/zathurarc: config/zathurarc
    ~/.config/ttyper/config.toml: config/ttyper.conf
    ~/.config/jj/config.toml: config/jj-config.toml
    # vim
    ~/.vimrc: vim/vimrc
    ~/.vim/functions.vim: vim/functions.vim
    ~/.vim/coc-settings.json: vim/coc-settings.json
    ~/.vim/spell/en.utf-8.add: vim/spell/en.utf-8.add
    # bash
    ~/.profile: bash/profile
    ~/.bashrc: bash/bashrc
    ~/.bash_aliases: bash/bash_aliases
    ~/.bash_env_vars.example: bash/bash_env_vars.example
    ~/.bash_aws_config: bash/bash_aws_config
    # git
    ~/.gitconfig: git/gitconfig
    ~/.gitattributes: git/gitattributes
    ~/.gitignore: git/gitignore
    ~/.git-hooks/commit-msg: git/hooks/commit-msg
    ~/.git-hooks/python-pre-push: git/hooks/python-pre-push
    ~/.commitlintrc.json: git/commitlintrc.json
    # bin
    ~/.local/bin/,cc: bin/,cc
    ~/.local/bin/,t: bin/,t
    ~/.local/bin/,n: bin/,n
    ~/.local/bin/,s: bin/,s
    ~/.local/bin/,urlgrep: bin/,urlgrep
    ~/.local/bin/,idle-guard: bin/,idle-guard
