[general]
# Machine-local overrides, untracked; see alacritty-local-example.toml.
# Missing imports are silently skipped, so this is safe on every machine.
import = ["~/.config/alacritty/local.toml"]

[colors.primary]
background = "#ffffdd"
foreground = "#000000"

[colors.normal]
black = "#242424"
red = "#f62b5a"
green = "#47b413"
yellow = "#e3c401"
blue = "#24acd4"
magenta = "#f2affd"
cyan = "#13c299"
white = "#e6e6e6"

[colors.bright]
black = "#616161"
red = "#ff4d51"
green = "#35d450"
yellow = "#e9e836"
blue = "#5dc5f8"
magenta = "#feabf2"
cyan = "#24dfc4"
white = "#ffffff"

# Audible ping on BELL: alacritty makes no sound itself, it runs a command.
# ,ping picks a player per OS; duration = 0 keeps the visual flash off.
[bell]
duration = 0
command = { program = "/bin/sh", args = ["-c", 'exec "$HOME/.local/bin/,ping"'] }
